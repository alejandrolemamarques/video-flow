<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#0F172A"></rect>

  <!-- Connections -->
  <g stroke="#60A5FA" stroke-width="18" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="256" x2="150" y2="150"></line>
    <line x1="256" y1="256" x2="362" y2="150"></line>
    <line x1="256" y1="256" x2="150" y2="362"></line>
    <line x1="256" y1="256" x2="362" y2="362"></line>
  </g>

  <!-- Outer nodes -->
  <g fill="#93C5FD">
    <circle cx="150" cy="150" r="28"></circle>
    <circle cx="362" cy="150" r="28"></circle>
    <circle cx="150" cy="362" r="28"></circle>
    <circle cx="362" cy="362" r="28"></circle>
  </g>

  <!-- Center node -->
  <circle cx="256" cy="256" r="78" fill="#2563EB"></circle>

  <!-- Play symbol -->
  <polygon points="238,222 238,290 292,256" fill="white"></polygon>
</svg>