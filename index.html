        <meta name="color-scheme" content="light" />
        <meta name="theme-color" content="#000000" />
        <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
        <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <script>
            try {
                var storedTheme = localStorage.getItem("videoFlowCanvasTheme");
                var bootColor =
                    storedTheme === "light" ? "#f3f4f6" : "#000000";
                var bootTheme = storedTheme === "light" ? "light" : "dark";
                document.documentElement.style.backgroundColor = bootColor;
                document.documentElement.dataset.flowTheme = bootTheme;
                var defaultMeta = document.querySelector(
                    'meta[name="theme-color"]:not([media])'
                );
                if (defaultMeta) defaultMeta.content = bootColor;
            } catch (e) {}
        </script>
        <meta name="apple-mobile-web-app-title" content="Video Map" />
